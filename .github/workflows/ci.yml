name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      # Ruff runs STANDALONE (uvx): linting must not require resolving the per-plugin ML
      # stacks (torch / timm / sam3 / ultralytics) — that would be slow and need extra
      # indexes. Config lives in pyproject [tool.ruff]; pin matches 3lc-plugin-sdk.
      - name: Ruff lint
        run: uvx --from 'ruff>=0.15,<0.16' ruff check .

      - name: Ruff format check
        run: uvx --from 'ruff>=0.15,<0.16' ruff format --check .

  # Release branches are cut from a tag, without a lockfile, and resolve from public PyPI.
  # Base deps only; tests that need the [yolo] extra skip themselves (importorskip).
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: uv run --with 'pytest>=8,<9' pytest -v
        # Same as main: `import tlc` needs a key, or it raises before importorskip can skip.
        env:
          TLC_API_KEY: ${{ secrets.TLC_API_KEY }}
          ${{ secrets.DEFAULT_TESTING_RUNTIME_NAME }}: ${{ secrets.DEFAULT_TESTING_RUNTIME_VALUE }}
          ${{ secrets.DEFAULT_TESTING_S_ENV_NAME }}: ${{ secrets.DEFAULT_TESTING_S_ENV_VALUE }}
